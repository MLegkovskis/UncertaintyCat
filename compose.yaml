services:
  compute:
    build:
      context: .
      dockerfile: services/compute/Dockerfile
    environment:
      UNCERTAINTYCAT_INTERNAL_TOKEN: local-compose-token
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - compute_internal
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g

networks:
  compute_internal:
    internal: true
