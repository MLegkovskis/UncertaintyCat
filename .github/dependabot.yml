version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Etc/UTC
    rebase-strategy: auto
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
      include: scope
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
      npm-routine:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:15"
      timezone: Etc/UTC
    rebase-strategy: auto
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
      include: scope
    groups:
      python-security:
        applies-to: security-updates
        patterns: ["*"]
      python-routine:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Etc/UTC
    rebase-strategy: auto
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
      include: scope
    groups:
      actions-routine:
        patterns: ["*"]
        update-types: [minor, patch]
