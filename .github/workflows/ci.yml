name: CI

on:
  push:
    branches: [main, "rework-2026-agentic"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.9.9"
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra dev
      - run: uv run ruff format --check uncertaintycat_core services tests test_all_examples.py
      - run: uv run ruff check uncertaintycat_core services tests test_all_examples.py
      - run: uv run mypy uncertaintycat_core services
      - run: uv run pytest --cov=uncertaintycat_core --cov=services --cov-report=term-missing

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:ts
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          retention-days: 14

  full-stack-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.9.9"
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: uv sync --frozen --extra dev
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:full-stack
      - name: Upload full-stack failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: full-stack-browser-failure-evidence
          path: |
            apps/web/test-results/
            apps/web/playwright-report-full-stack/
          retention-days: 14

  compute-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Build local compute-service image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/compute/Dockerfile
          push: false
          tags: uncertaintycat-compute:ci
          cache-from: type=gha,scope=compute-service
          cache-to: type=gha,mode=max,scope=compute-service
      - name: Build production Cloudflare Sandbox image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/compute/Dockerfile.sandbox
          push: false
          tags: uncertaintycat-sandbox:ci
          cache-from: type=gha,scope=cloudflare-sandbox
          cache-to: type=gha,mode=max,scope=cloudflare-sandbox
