name: Deploy production

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: Exact successful main revision to deploy
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: uncertaintycat-production
  cancel-in-progress: false

jobs:
  authorize:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event != 'workflow_dispatch')
    runs-on: ubuntu-latest
    outputs:
      target_sha: ${{ steps.authorize.outputs.target_sha }}
    steps:
      - name: Authorize an exact successful main revision
        id: authorize
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          TARGET_SHA: ${{ inputs.sha || github.event.workflow_run.head_sha }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]

          comparison="$(gh api "repos/$REPOSITORY/compare/$TARGET_SHA...main" --jq '.status')"
          [[ "$comparison" == "identical" ]]

          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            source_run="$(gh api "repos/$REPOSITORY/actions/runs/$SOURCE_RUN_ID")"
            [[ "$(jq -r '.path' <<<"$source_run")" == ".github/workflows/ci.yml" ]]
            [[ "$(jq -r '.head_sha' <<<"$source_run")" == "$TARGET_SHA" ]]
            [[ "$(jq -r '.head_branch' <<<"$source_run")" == "main" ]]
            [[ "$(jq -r '.conclusion' <<<"$source_run")" == "success" ]]
          else
            successful_runs="$(gh api "repos/$REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$TARGET_SHA&status=success&per_page=20")"
            jq -e --arg sha "$TARGET_SHA" \
              '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == "main" and .conclusion == "success")] | length > 0' \
              <<<"$successful_runs" >/dev/null
          fi

          echo "target_sha=$TARGET_SHA" >>"$GITHUB_OUTPUT"

  deploy:
    needs: authorize
    if: needs.authorize.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://uncertaintycat.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.authorize.outputs.target_sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @uncertaintycat/web
      - name: Prepare production bindings
        run: node .github/scripts/prepare-cloudflare-config.mjs
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
      - name: Validate required deployment secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$BETTER_AUTH_SECRET"
          test -n "$CLOUDFLARE_ACCESS_CLIENT_ID"
          test -n "$CLOUDFLARE_ACCESS_CLIENT_SECRET"
          case "${AI_PROVIDER:-groq}" in
            groq) test -n "$GROQ_API_KEY" ;;
            cloudflare) ;;
            *) echo "AI_PROVIDER must be groq or cloudflare" >&2; exit 1 ;;
          esac
      - name: Apply forward-only D1 migrations
        run: npm exec --workspace @uncertaintycat/api -- wrangler d1 migrations apply uncertaintycat-production --remote --config wrangler.generated.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Create ephemeral Worker secrets file
        shell: bash
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          umask 077
          {
            printf 'BETTER_AUTH_SECRET=%s\n' "$BETTER_AUTH_SECRET"
            printf 'CLOUDFLARE_ACCESS_CLIENT_ID=%s\n' "$CLOUDFLARE_ACCESS_CLIENT_ID"
            printf 'CLOUDFLARE_ACCESS_CLIENT_SECRET=%s\n' "$CLOUDFLARE_ACCESS_CLIENT_SECRET"
            if test -n "$GROQ_API_KEY"; then
              printf 'GROQ_API_KEY=%s\n' "$GROQ_API_KEY"
            fi
          } > apps/api/.production.secrets
      - name: Deploy Worker, assets, queue consumer, and compute sandbox
        run: npm exec --workspace @uncertaintycat/api -- wrangler deploy --config wrangler.generated.jsonc --secrets-file .production.secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Remove ephemeral secret material
        if: always()
        run: rm -f apps/api/.production.secrets
      - name: Production smoke test
        shell: bash
        run: |
          for _ in {1..12}; do
            if curl --fail --silent --show-error https://uncertaintycat.com/health | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 10
          done
          exit 1

  verify-ui:
    needs: [authorize, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.authorize.outputs.target_sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:production
      - name: Upload production verification evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-ui-failure-evidence
          path: |
            apps/web/test-results/
            apps/web/playwright-report-production/
          retention-days: 14
