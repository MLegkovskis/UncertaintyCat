[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uncertaintycat"
version = "0.2.0"
description = "Versioned OpenTURNS uncertainty quantification core and services"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "openpyxl>=3.1.5,<4",
    "openturns==1.27.post1",
    "otmorris==0.20.post1",
    "scipy",
    "pydantic>=2.9,<3",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
    "black",
    "colorama>=0.4.6",
    "httpx>=0.27",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6",
    "ruff>=0.8",
]

[tool.uv]
package = true


[tool.setuptools]
packages = [
    "uncertaintycat_core",
    "uncertaintycat_core.plugins",
    "services",
    "services.compute",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
markers = [
    "scientific: numerical regression and statistical acceptance tests",
    "integration: tests crossing service or process boundaries",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["openturns", "otmorris", "scipy", "scipy.*", "pandas", "openpyxl", "openpyxl.*"]
ignore_missing_imports = true
